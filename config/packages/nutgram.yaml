nutgram:
    token: '%env(string:TELEGRAM_TOKEN)%'
    routes: true
    config:
        botName: '%env(string:TELEGRAM_BOT_NAME)%'
        clientTimeout: '%env(int:TELEGRAM_CLIENT_TIMEOUT)%'
        pollingTimeout: '%env(int:TELEGRAM_POLLING_TIMEOUT)%'
        enableHttp2: '%env(bool:TELEGRAM_ENABLE_HTTP2)%'
